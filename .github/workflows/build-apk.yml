name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install & Build Android
        run: |
          npm install
          npm install -D @capacitor/assets
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#050811'
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          add = """<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <queries>
            <package android:name="com.polytron.ev_app" />
            <package android:name="com.google.android.apps.maps" />
          </queries>
          <application"""
          open(p, "w").write(s.replace("<application", add, 1))
          '
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ev-cockpit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
